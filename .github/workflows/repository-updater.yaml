---
name: Repository Updater

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      app:
        description: >-
          The slug of the app to check. Empty: the one a repository_dispatch names, or, without
          one, every app.
        required: false
        type: string
        default: ""
    secrets:
      UPDATER_TOKEN:
        required: true

# The updater commits with UPDATER_TOKEN; the workflow's own token needs nothing more.
permissions:
  contents: read

# One run at a time: a run that finds the apps repository changed under it
# stops instead of committing, so queue them up.
concurrency:
  group: repository-updater
  cancel-in-progress: false

jobs:
  publish:
    name: Publish app update
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Repository Updater
        # v3.0.0
        uses: hassio-addons/repository-updater@c7cece7bb502aeae1f3fdcf2b02a5fa200add71d
        with:
          app: ${{ inputs.app || github.event.client_payload.app }}
          repository: ${{ github.repository }}
          token: ${{ secrets.UPDATER_TOKEN }}
